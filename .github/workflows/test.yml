name: test
on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: nodenv/actions/node-version@9786f5d00d4d713533372f46cbc78fa149976ae8 # main
        id: nodenv
      - name: Use Node.js ${{ steps.nodenv.outputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nodenv.outputs.node-version }}"
      - name: pnpm install, build, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm build:all
          pnpm test
      - name: Test built package (Chrome)
        run: pnpm exec web-ext lint --source-dir ./build/chrome
      - name: Test built package (Firefox)
        run: pnpm exec web-ext lint --source-dir ./build/firefox
