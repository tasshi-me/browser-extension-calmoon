name: test
on:
  push:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: nodenv/actions/node-version@a951c9ffd012545fc0867d4b3cbd986c12c4a3c0 # main
        id: nodenv
      - name: Use Node.js ${{ steps.nodenv.outputs.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: "${{ steps.nodenv.outputs.node-version }}"
      - name: pnpm install, build, and test
        run: |
          pnpm install --frozen-lockfile
          pnpm build:all
          pnpm test
      - name: Test built package (Chrome)
        run: pnpm exec web-ext lint --source-dir ./build/chrome
      - name: Test built package (Firefox)
        run: pnpm exec web-ext lint --source-dir ./build/firefox
